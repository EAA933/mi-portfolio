<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="1280" height="800" fill="#0b0d12"/>
  <!-- Sidebar de conversaciones -->
  <rect x="0" y="0" width="360" height="800" fill="#12151d"/>
  <rect x="0" y="0" width="360" height="72" fill="#151922"/>
  <circle cx="44" cy="36" r="16" fill="#34d399"/>
  <text x="72" y="42" fill="#eef1f7" font-size="20" font-weight="700">Vyntra Flow</text>
  <text x="72" y="60" fill="#8a8fa8" font-size="12">Asistente de ventas · IA</text>
  <g fill="#8a8fa8" font-size="14">
    <g>
      <rect x="16" y="92" width="328" height="72" rx="12" fill="#1b2029"/>
      <circle cx="48" cy="128" r="20" fill="#22344a"/>
      <text x="80" y="122" fill="#eef1f7" font-size="15" font-weight="600">Cliente · Laura M.</text>
      <text x="80" y="144" fill="#8a8fa8" font-size="13">¿Tienen envío a Pachuca?</text>
      <circle cx="326" cy="112" r="9" fill="#34d399"/>
    </g>
    <g transform="translate(0,84)"><rect x="16" y="92" width="328" height="72" rx="12" fill="#12151d"/><circle cx="48" cy="128" r="20" fill="#2a2f3a"/><text x="80" y="122" fill="#c7ccd8" font-size="15" font-weight="600">Cliente · Diego R.</text><text x="80" y="144" fill="#8a8fa8" font-size="13">Quiero 3 cajas…</text></g>
    <g transform="translate(0,168)"><rect x="16" y="92" width="328" height="72" rx="12" fill="#12151d"/><circle cx="48" cy="128" r="20" fill="#2a2f3a"/><text x="80" y="122" fill="#c7ccd8" font-size="15" font-weight="600">Cliente · Ana P.</text><text x="80" y="144" fill="#8a8fa8" font-size="13">Gracias! 🙌</text></g>
  </g>
  <!-- Ventana de chat -->
  <rect x="360" y="0" width="920" height="72" fill="#151922"/>
  <circle cx="404" cy="36" r="18" fill="#22344a"/>
  <text x="436" y="32" fill="#eef1f7" font-size="17" font-weight="600">Laura M.</text>
  <text x="436" y="52" fill="#34d399" font-size="12">● respondiendo automáticamente</text>
  <!-- Burbujas -->
  <g font-size="16">
    <rect x="404" y="120" width="360" height="52" rx="16" fill="#1b2029"/>
    <text x="428" y="152" fill="#e8eaf2">¿Tienen envío a Pachuca?</text>

    <rect x="612" y="196" width="524" height="84" rx="16" fill="#0f3d2e"/>
    <text x="636" y="228" fill="#d6ffe9">¡Hola Laura! Sí, enviamos a Pachuca 🚚</text>
    <text x="636" y="256" fill="#d6ffe9">Una caja de temporada cuesta $250. ¿Te agendo entrega?</text>
    <text x="1112" y="272" fill="#34d399" font-size="11" text-anchor="end">IA</text>

    <rect x="404" y="304" width="300" height="52" rx="16" fill="#1b2029"/>
    <text x="428" y="336" fill="#e8eaf2">Sí, para el viernes</text>

    <rect x="612" y="380" width="524" height="84" rx="16" fill="#0f3d2e"/>
    <text x="636" y="412" fill="#d6ffe9">Perfecto ✅ Agendado viernes 10am.</text>
    <text x="636" y="440" fill="#d6ffe9">Te paso el link de pago y confirmo con el equipo.</text>
    <text x="1112" y="456" fill="#34d399" font-size="11" text-anchor="end">IA</text>
  </g>
  <!-- Barra de estado inferior -->
  <rect x="360" y="720" width="920" height="80" fill="#12151d"/>
  <rect x="404" y="744" width="620" height="40" rx="20" fill="#1b2029"/>
  <text x="428" y="769" fill="#6b7186" font-size="14">La IA responde y solo te avisa si necesita ayuda…</text>
  <circle cx="1180" cy="764" r="24" fill="#34d399"/>
  <path d="M1170 764 l7 7 l14 -14" stroke="#0b0d12" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
